{% load static %}
<c-vars exam venue tab to_deliver="" class="" />
{# An invigilator's phone: the app bar as invigilator/base.html draws it, a page, and the tab bar. #}
<div class="landing-phone {{ class }}">
  <div class="landing-phone-screen">
    <header class="appbar static">
      <div class="appbar-row px-4">
        <span class="flex min-w-0 items-center gap-2"><img src="{% static 'examdesk/logo.svg' %}" alt="" class="size-7 shrink-0"><span class="truncate font-semibold">{{ exam }}</span></span>
        <span class="venue-picker-button ml-auto"><c-icon name="map-pin" />{{ venue }}<c-icon name="chevron-down" class="size-3.5" /></span>
      </div>
    </header>
    <div class="landing-phone-page">{{ slot }}</div>
    <nav class="dock">
      <a aria-current="{% if tab == 'report' %}page{% else %}false{% endif %}"><c-icon name="square-pen" /><span class="dock-label">Report</span></a>
      <a aria-current="false"><c-icon name="hourglass" /><span class="dock-label">Waiting</span></a>
      <a data-el="deliver-tab" aria-current="{% if tab == 'deliver' %}page{% else %}false{% endif %}"><c-icon name="send" /><span class="dock-label">Deliver</span><span class="count action" data-el="deliver-count"{% if not to_deliver %} data-shown="0"{% endif %}>{{ to_deliver|default:"1" }}</span></a>
      <a aria-current="false"><c-icon name="megaphone" /><span class="dock-label">Read out</span></a>
    </nav>
  </div>
</div>
