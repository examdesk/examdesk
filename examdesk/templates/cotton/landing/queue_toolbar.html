<c-vars open answered closed />
{# The queue's state tabs, on Open, and its filters as Tom Select draws them (examiner/includes/queue.html). #}
<div class="queue-toolbar">
  <nav class="tabs tabs-box tabs-sm fill"><a class="tab gap-1.5" aria-current="true">Open<span class="num" data-el="open-count">{{ open }}</span></a><a class="tab gap-1.5">Answered<span class="num" data-el="answered-count">{{ answered }}</span></a><a class="tab gap-1.5">Closed<span class="num" data-el="closed-count">{{ closed }}</span></a></nav>
  <div class="filters flex gap-2">
    <div class="min-w-0 flex-1"><div class="ts-wrapper multi"><div class="ts-control"><input placeholder="All questions"></div></div></div>
    <div class="shrink-0"><div class="ts-wrapper single full has-items"><div class="ts-control"><div class="item">Longest wait</div></div></div></div>
  </div>
</div>
