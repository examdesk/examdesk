<c-vars id icon name title description="" />
{# A section of the landing page: its name as a chip, its heading and its description over `slot`. #}
<section id="{{ id }}" class="scroll-mt-16 px-4 py-12 sm:px-6 sm:py-16">
  <div class="mx-auto mb-10 grid max-w-4xl justify-items-center gap-4 text-center sm:mb-12">
    <span class="inline-flex items-center gap-1.5 rounded-full bg-base-300/70 px-2.5 py-0.5 text-meta font-medium text-muted"><c-icon name="{{ icon }}" />{{ name }}</span>
    <h2 class="landing-heading">{{ title }}</h2>
    {% if description %}<p class="max-w-2xl text-lg text-muted">{{ description }}</p>{% endif %}
  </div>
  {{ slot }}
</section>
