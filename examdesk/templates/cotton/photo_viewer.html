<c-vars id src alt class="" />{# Its slot, a photo or a thumbnail of it, opens the photo full size in a dialog. #}
<button type="button" class="cursor-zoom-in{% if class %} {{ class }}{% endif %}" commandfor="{{ id }}" command="show-modal" aria-label="{{ alt }}">{{ slot }}</button>
<dialog id="{{ id }}" class="modal photo-viewer" aria-label="{{ alt }}">
  <div class="modal-box">
    <img src="{{ src }}" alt="{{ alt }}" loading="lazy">
    <button type="button" class="btn btn-circle btn-sm" commandfor="{{ id }}" command="close" aria-label="Close"><c-icon name="x" /></button>
  </div>
  <form method="dialog" class="modal-backdrop"><button>Close</button></form>
</dialog>
