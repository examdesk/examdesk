{# A text link, or with `square` an icon button. #}
<c-vars href label square />{% if square %}<a class="btn btn-outline btn-square" href="{{ href }}" aria-label="{{ label }}"><c-icon name="chevron-left" /></a>{% else %}<a href="{{ href }}" class="mb-3 inline-flex items-center gap-1 text-sm font-medium text-muted hover:text-base-content"><c-icon name="chevron-left" />{{ label }}</a>{% endif %}
