{% load static %}
{# A page with a single card, such as sign-in. `lead` may be a named slot. #}
<c-vars title lead />
<div class="mx-auto mt-6 max-w-sm sm:mt-14">
  <div class="card-box p-6 shadow-sm sm:p-8">
    <img src="{% static 'examdesk/logo.svg' %}" alt="" class="mb-5 size-10">
    <h1>{{ title }}</h1>
    {% if lead %}<p class="mt-1 text-sm text-muted">{{ lead }}</p>{% endif %}
    <div class="mt-6">{{ slot }}</div>
  </div>
</div>
