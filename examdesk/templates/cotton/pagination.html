{# Previous and next page links. #}
<c-vars page_obj />{% if page_obj.has_other_pages %}<nav class="join mt-4" aria-label="Pagination">{% if page_obj.has_previous %}<a class="join-item btn btn-outline btn-sm" href="{% querystring page=page_obj.previous_page_number %}" rel="prev"><c-icon name="chevron-left" />Previous</a>{% endif %}<span class="join-item btn btn-outline btn-sm pointer-events-none">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="join-item btn btn-outline btn-sm" href="{% querystring page=page_obj.next_page_number %}" rel="next">Next<c-icon name="chevron-right" /></a>{% endif %}</nav>{% endif %}
